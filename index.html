<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arknights Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0d1117 0%,#111722 100%);color:#eef2f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:980px;margin:auto;padding:44px 20px}.brand{margin-bottom:34px}.eyebrow{color:#e7b94e;font-weight:800;letter-spacing:.12em;font-size:12px}.brand h1{font-size:42px;margin:8px 0 10px}.brand p{margin:0;color:#9ca8b8;font-size:16px;line-height:1.7}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:20px;align-items:center;background:#171d26;border:1px solid #2c3644;border-radius:18px;padding:24px;color:inherit;text-decoration:none;transition:.18s ease;min-height:144px}.card:focus-visible{outline:2px solid #f0c65a;outline-offset:4px}.card:hover{transform:translateY(-3px);border-color:#59697e;background:#1b2330}.icon{grid-column:1;grid-row:1 / span 2;font-size:34px;color:#f0c65a}.card h2{grid-column:2;grid-row:1;margin:0 0 9px;font-size:22px}.card p{grid-column:2;grid-row:2;margin:0;color:#9eabba;line-height:1.65}.go{grid-column:3;grid-row:1 / span 2;display:inline-block;white-space:nowrap;color:#f0c65a;font-weight:800}
.footer{margin-top:28px;color:#758294;font-size:13px}
@media(max-width:720px){.wrap{padding-top:36px}.brand h1{font-size:32px}.grid{grid-template-columns:1fr}.card{grid-template-columns:32px minmax(0,1fr);column-gap:14px;padding:20px;min-height:150px}.icon{font-size:28px}.card h2{font-size:20px}.go{grid-column:2;grid-row:3;margin-top:14px;font-size:14px}}
</style>
</head>
<body>
<main class="wrap">
<section class="brand">
<div class="eyebrow">MOONWHALE · ARKNIGHTS TOOL</div>
<h1>명일방주 도구</h1>
<p>사용할 기능을 선택하세요.</p>
</section>
<section class="grid" aria-label="기능 선택">
<a class="card" href="recruitment.html">
<div class="icon" aria-hidden="true">⌗</div>
<h2>공개모집 계산기</h2>
<p>표시된 태그를 선택하면 가능한 태그 조합과 등장 오퍼레이터를 계산합니다.</p>
<span class="go">계산기 열기 →</span>
</a>
<a class="card" href="operators.html">
<div class="icon" aria-hidden="true">◆</div>
<h2>오퍼레이터 관리</h2>
<p>보유 여부, 정예화, 레벨, 잠재, 신뢰도, 스킬·마스터리와 모듈 현황을 저장합니다.</p>
<span class="go">관리 페이지 열기 →</span>
</a>
<a class="card" href="materials.html"><div class="icon" aria-hidden="true">▦</div><h2>육성 재료</h2><p>오퍼레이터별 정예화, 스킬, 마스터리와 모듈의 육성 재료를 확인합니다.</p><span class="go">재료 페이지 열기 →</span></a></section>
<div class="footer">육성 데이터와 설정값은 현재 사용 중인 브라우저에 저장됩니다.</div>
</main>
</body>
</html>
