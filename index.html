<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arknights Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0d1117 0%,#111722 100%);color:#eef2f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:980px;margin:auto;padding:64px 20px}.brand{margin-bottom:34px}.eyebrow{color:#e7b94e;font-weight:800;letter-spacing:.12em;font-size:12px}.brand h1{font-size:42px;margin:8px 0 10px}.brand p{margin:0;color:#9ca8b8;font-size:16px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:block;background:#171d26;border:1px solid #2c3644;border-radius:18px;padding:24px;color:inherit;text-decoration:none;transition:.18s ease;min-height:210px}.card:hover{transform:translateY(-3px);border-color:#59697e;background:#1b2330}.icon{font-size:34px;margin-bottom:25px}.card h2{margin:0 0 9px;font-size:22px}.card p{margin:0;color:#9eabba;line-height:1.65}.go{display:inline-block;margin-top:24px;color:#f0c65a;font-weight:800}
.footer{margin-top:28px;color:#758294;font-size:13px}
@media(max-width:720px){.wrap{padding-top:36px}.brand h1{font-size:32px}.grid{grid-template-columns:1fr}.card{min-height:180px}}
</style>
</head>
<body>
<main class="wrap">
<section class="brand">
<div class="eyebrow">MOONWHALE · ARKNIGHTS TOOL</div>
<h1>명일방주 도구</h1>
<p>공개모집 조합 계산과 개인 오퍼레이터 육성 현황을 한 사이트에서 관리할 수 있습니다.</p>
</section>
<section class="grid">
<a class="card" href="recruitment.html">
<div class="icon">⌗</div>
<h2>공개모집 계산기</h2>
<p>표시된 태그를 선택하면 가능한 태그 조합과 등장 오퍼레이터를 계산합니다.</p>
<span class="go">계산기 열기 →</span>
</a>
<a class="card" href="operators.html">
<div class="icon">◆</div>
<h2>오퍼레이터 관리</h2>
<p>보유 여부, 정예화, 레벨, 잠재, 신뢰도, 스킬·마스터리와 모듈 현황을 저장합니다.</p>
<span class="go">관리 페이지 열기 →</span>
</a>
</section>
<div class="footer">육성 데이터와 설정값은 현재 사용 중인 브라우저에 저장됩니다.</div>
</main>
</body>
</html>
