<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명일방주 창고</title>
<link rel="stylesheet" href="assets/css/zoot-navigation.css?v=1">
<link rel="stylesheet" href="assets/css/zoot.css?v=12">
<link rel="stylesheet" href="assets/css/zoot-depot.css?v=6">
<script src="assets/js/zoot.js?v=6"></script>
<link rel="stylesheet" href="assets/css/guide-tour.css?v=1">
<script type="module" src="assets/js/guide-tour.mjs?v=1"></script>
</head>
<body class="zoot-depot">
<main class="bag">
<header class="depot-header">
<div class="title"><h1>창고</h1><span>DEPOT</span></div>
<nav id="categories" class="categories" aria-label="창고 분류"></nav>
</header>
<div class="toolbar">
<input id="search" type="search" placeholder="재료 검색" aria-label="재료 검색">
<select id="subcategory" aria-label="세부 분류"><option value="all">세부 분류 전체</option><option value="material">육성 재료</option><option value="experience">작전기록</option><option value="chip">정예화 칩</option><option value="skill">스킬개론</option><option value="module">모듈 재료</option><option value="potential">증표</option><option value="currency">재화</option></select>
<button id="ownedOnly" class="ownership-switch" type="button" role="switch" aria-checked="true" aria-label="보유 아이템만 보기" title="보유 아이템 표시 중 · 누르면 전체 아이템 표시"><span class="ownership-owned">보유</span><span class="ownership-track" aria-hidden="true"><span class="ownership-thumb"></span></span><span class="ownership-all">전체</span></button>
<span id="itemTotal" aria-live="polite"></span>
<div id="wallet" class="wallet" aria-label="보유 용문폐"></div>
</div>
<section id="itemViewport" class="items-viewport" aria-label="보유 아이템 · 좌우로 스크롤">
<div id="items" class="items"><p class="no-items">창고를 불러오는 중입니다.</p></div>
</section>
<footer class="depot-footer"><p id="status" class="status" role="status" aria-live="polite"></p><p class="note">좌우로 스크롤해 아이템을 확인하세요. 아이템을 누르면 보유 수량을 편집할 수 있습니다. 수량은 자동 저장되며 계정 가져오기와 연동됩니다.</p></footer>
</main>
<dialog id="itemDialog" class="depot-item-dialog" aria-labelledby="itemTitle">
<button type="button" id="detailClose" class="detail-close" aria-label="아이템 상세 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<div id="detail"></div>
<p id="detailStatus" class="detail-status" role="status" aria-live="polite"></p>
</dialog>
<script type="module" src="assets/js/backpack.mjs?v=15"></script>
</body>
</html>
