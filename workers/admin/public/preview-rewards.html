<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광산 · Z.O.O.T.</title><link rel="stylesheet" href="assets/css/zoot.css"><link rel="stylesheet" href="rewards.css"><script src="assets/js/zoot.js"></script><script type="module" src="rewards.js"></script></head><body class="zoot-page"><main class="reward-wrap"><div class="reward-heading"><div><p class="eyebrow">ONE-TIME REWARDS</p><h1>광산</h1></div><button id="rewardsImport" class="zoot-button zoot-button-primary">계정 가져오기</button></div><p id="rewardsMessage" class="reward-message" role="alert" hidden></p><div class="reward-totals"><article><span>남은 순오리지늄</span><strong id="rewardsOriginite">—</strong><small>스테이지 초회 · 추가 별 누적 보상</small></article><article><span>남은 합성옥</span><strong id="rewardsOrundum">—</strong><small>역설 시뮬레이션 · 섬멸 최초 달성</small></article></div><section id="rewardsResults" hidden><div class="reward-filters"><input id="rewardsSearch" type="search" placeholder="스테이지 · 오퍼레이터 검색" aria-label="보상 검색"><select id="rewardsCurrency" aria-label="보상 종류"><option value="">모든 재화</option value="originite">순오리지늄</option><option value="orundum">합성옥</option></select><select id="rewardsStatus" aria-label="수령 상태"><option value="remaining">미수령</option><option value="claimed">수령 완료</option><option value="unknown">확인 필요</option><option value="">전체 상태</option></select></div><p id="rewardsCount" class="reward-source"></p><div id="rewardsGroups"></div></section><details class="reward-notes"><summary>계산 기준</summary><p>현재 입장 경로가 있는 콘텐츠의 일회성 보상만 계산합니다. 순오리지늄은 초회·추가 별 누적 보상, 합성옥은 보유 오퍼레이터의 역설 시뮬레이션과 현재 개방 중인 섬멸 최초 달성 보상을 포함합니다.</p><p>계정 조회 시점의 수령 기록을 사용합니다. 미확인 보상은 합계에서 제외하며, 게임에서 보상을 수령한 뒤에는 계정을 다시 가져오세요. 한국 서버 게임 데이터 스냅샷 기준입니다.</p></details></main></body></html>
