<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영광의 길 · 관리자 미리보기</title><link rel="icon" href="/preview/assets/icons/site-favicon.png"><link rel="stylesheet" href="/medals/style.css?v=8"><script type="module" src="/medals/ui.js?v=7"></script></head><body><main class="glory"><header class="glory-top"><button id="gloryBack" class="back" aria-label="이전 화면">〈</button><h1>영광의 길 <small>PATH TO GLORY</small></h1><button id="gloryInfo" aria-label="계정 및 미리보기 설정">ⓘ</button><div class="top-spacer"></div><nav id="gloryViews" hidden aria-label="도감 보기 방식"><button id="gloryList" aria-pressed="true">훈장 목록</button><button id="glorySets" aria-pressed="false">훈장 세트</button></nav></header><section id="gloryHome" class="glory-home"><div class="home-display"><div class="display-heading"><span>THE GLORIOUS MOMENT</span><button id="gloryEdit">↗ 편집</button></div><div id="gloryDisplay" class="display-stage"></div><div class="display-caption"><strong>훈장 패널</strong><span>기록으로 남긴 당신의 발자취</span></div></div><button id="gloryAlbum" class="album-entry"><span class="album-count"><b id="homeOwned">—</b><small>보유 훈장</small></span><div id="gloryAlbumArt" aria-hidden="true"></div><span class="album-label"><strong>훈장 도감</strong><small>MEDAL ALBUM</small><b>›</b></span></button></section><section id="gloryAlbumPage" class="album-page" hidden><aside class="album-summary"><span class="summary-eyebrow">MEDAL COLLECTION</span><div class="owned-ring"><strong id="medalOwned">—</strong><span>보유 훈장</span></div><p class="summary-title" id="gloryCategory">전체 훈장</p><div class="summary-line"><span>전체 훈장</span><strong id="medalTotal">—</strong></div><div class="summary-line"><span>가공 훈장</span><strong id="medalTrimmed">—</strong></div><div id="gloryRarities"></div><div class="summary-watermark">GLORY<br>RECORD</div></aside><section class="album-main"><div class="album-toolbar"><div class="ownership-tabs" role="group" aria-label="보유 여부"><button data-ownership="all" aria-pressed="true">전체</button><button data-ownership="owned" aria-pressed="false">보유</button><button data-ownership="missing" aria-pressed="false">미보유</button></div><label class="sort-label">정렬<select id="medalSort" aria-label="훈장 정렬"><option value="game">인게임 순서</option><option value="recent">획득일</option><option value="name">이름</option></select></label><button id="glorySearchToggle" aria-label="검색 열기">⌕</button></div><input id="medalSearch" type="search" placeholder="훈장 이름 · 획득 조건" aria-label="훈장 검색" hidden><div class="album-scroll"><div id="medalGroups"></div><p id="medalEmpty" hidden></p></div><footer class="album-footer"><span id="medalCount"></span><span id="medalMessage" role="status">계정 데이터 불러오는 중</span></footer></section><nav id="medalTypes" class="medal-types" aria-label="훈장 분류"></nav></section><section id="glorySetPage" class="set-page" hidden><header><button id="glorySetBack">〈 세트 목록</button><div><h2 id="glorySetName"></h2><p id="glorySetCount"></p></div><button id="gloryExhibit">전시하기</button></header><div id="glorySetStage"></div><p id="glorySetDescription"></p></section><dialog id="medalDetail" aria-labelledby="medalDetailName"><button id="medalClose" class="modal-close" aria-label="닫기">×</button><div id="medalDetailArt"></div><div class="detail-copy"><p id="medalDetailType"></p><h2 id="medalDetailName"></h2><p id="medalDetailStatus"></p><p id="medalDetailDescription"></p><section><h3>획득 조건</h3><p id="medalDetailCondition"></p><div id="medalProgress"></div></section><section id="medalTrimSection" hidden><h3>가공 조건</h3><p id="medalTrimCondition"></p></section><p id="medalDate"></p></div></dialog><dialog id="glorySettings"><button class="modal-close" data-close="glorySettings" aria-label="닫기">×</button><h2>관리자 미리보기</h2><p>가져온 계정의 훈장을 자동 적용합니다.</p><button id="medalAccount">가져온 계정 적용</button><button id="medalFileOpen">JSON으로 미리보기</button><input id="medalFile" type="file" accept=".json,application/json" hidden><p>전시하기는 이 브라우저에만 저
