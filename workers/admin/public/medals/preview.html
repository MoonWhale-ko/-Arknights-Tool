<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>훈장 미리보기 · Z.O.O.T.</title><link rel="icon" href="/preview/assets/icons/site-favicon.png"><link rel="stylesheet" href="/preview/assets/css/zoot.css?v=14"><link rel="stylesheet" href="/medals/style.css?v=1"><script defer src="/preview/assets/js/zoot.js?v=9"></script><script type="module" src="/medals/ui.js?v=1"></script></head><body class="zoot-page"><main class="medal-page"><header class="medal-heading"><div><p class="medal-eyebrow">MEDAL COLLECTION · PRIVATE PREVIEW</p><h1>훈장 보관함</h1><p>로도스 아일랜드에서 쌓아온 기록</p></div><div class="medal-actions"><button id="medalAccount" type="button">가져온 계정 적용</button><button id="medalFileOpen" type="button">JSON으로 미리보기</button><input id="medalFile" type="file" accept=".json,application/json" hidden></div></header><p id="medalMessage" role="status">관리 사이트에서 가져온 계정을 자동으로 적용합니다.</p><section class="medal-summary" aria-label="훈장 보유 현황"><article><span>보유 훈장</span><strong id="medalOwned">—</strong></article><article><span>가공 훈장</span><strong id="medalTrimmed">—</strong></article><article><span>전체 훈장</span><strong id="medalTotal">—</strong></article></section><section class="medal-filter-panel" aria-label="훈장 검색 및 필터"><div class="medal-search-row"><input id="medalSearch" type="search" aria-label="훈장 검색" placeholder="훈장 이름 · 획득 조건 · 시리즈 검색"><label>보유 여부<select id="medalOwnership"><option value="owned">보유</option><option value="all">전체</option><option value="missing">미보유</option><option value="trimmed">가공 완료</option></select></label><label>정렬<select id="medalSort"><option value="game">인게임 순서</option><option value="recent">최근 획득</option><option value="name">이름</option></select></label></div><div id="medalTypes" class="medal-types" role="group" aria-label="훈장 분류"></div><label class="medal-series">시리즈<select id="medalSeries"><option value="">전체 시리즈</option></select></label></section><div class="medal-result-heading"><h2 id="medalResultTitle">보유 훈장</h2><span id="medalCount" aria-live="polite"></span></div><div id="medalGroups"></div><p id="medalEmpty" class="medal-empty" hidden></p><dialog id="medalDetail" aria-labelledby="medalDetailName"><button id="medalClose" class="medal-close" type="button" aria-label="훈장 상세 닫기">×</button><div id="medalDetailArt"></div><p id="medalDetailType" class="medal-eyebrow"></p><h2 id="medalDetailName"></h2><p id="medalDetailStatus"></p><p id="medalDetailDescription"></p><section><h3>획득 조건</h3><p id="medalDetailCondition"></p><div id="medalProgress"></div></section><section id="medalTrimSection" hidden><h3>가공 조건</h3><p id="medalTrimCondition"></p></section><p id="medalDate" class="medal-date"></p></dialog></main></body></html>
