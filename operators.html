<style>
*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#edf2f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:28px}.nav{display:flex;gap:8px}.nav a,.btn{border:1px solid #3a4556;background:#1d2430;color:#fff;border-radius:0;padding:9px 12px;cursor:pointer}
.panel{background:#171c24;border:1px solid #2b3441;border-radius:0;padding:14px;margin-top:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:#10151c;color:#fff;border:1px solid #3a4556;border-radius:0;padding:8px}
input[type=number]{width:74px}.search{min-width:220px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stat{background:#10151c;border:1px solid #2c3542;border-radius:0;padding:10px;text-align:center}.stat b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-top:14px}
.card{background:#151b23;border:2px solid #303a48;border-radius:0;padding:10px}.r1{border-color:#7d8794}.r2{border-color:#c2ef57}.r3{border-color:#58a9e6}.r4{border-color:#a878e8}.r5{border-color:#e5b84b}.r6{border-color:#e86f42}
.head{display:flex;gap:10px;align-items:center}.avatar-wrap{width:64px;height:64px;position:relative;flex:none}.avatar{width:64px;height:64px;border-radius:0;background:#252d38;object-fit:cover}.avatar-fallback{width:64px;height:64px;border-radius:0;background:#252d38;place-items:center;font-weight:900;font-size:20px;color:#b9c4d2}.name{font-weight:850}.stars{color:#f4c65a;font-size:12px}.owned{margin-left:auto}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.field label{display:block;font-size:11px;color:#9eabba;margin-bottom:3px}.field select,.field input{width:100%}
.masteries,.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.progress-body.is-disabled{opacity:.42;pointer-events:none}.muted{color:#9aa5b4}.hidden{display:none!important}
.exportBox{position:absolute;left:-100000px;top:0;width:1400px;background:#0e1116;color:#eef;padding:24px}.exportGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.exportCard{background:#171c24;border:2px solid #334;padding:8px;border-radius:0}.exportCard .nm{font-weight:800}.exportSmall{font-size:12px;color:#c7d0db;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}.fields,.masteries,.modules{grid-template-columns:repeat(2,1fr)}}

*{box-sizing:border-box;border-radius:0}body{margin:0;background:#0e1116;color:#edf2f7;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto;padding:22px}header{display:flex;align-items:center;gap:14px;margin-bottom:18px}header svg{width:24px;height:24px}h1{font-size:20px;margin:0}.note{color:#9eabba;font-size:12px;margin:5px 0 0}.toolbar{display:flex;gap:8px;margin-bottom:14px}input,select,button{font:inherit;color:inherit;background:#10151c;border:1px solid #3a4556;padding:6px;min-width:0}button{cursor:pointer}.toolbar input{width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}.card{display:grid;grid-template-columns:32% minmax(0,1fr);border:2px solid var(--color);background:#151b23;overflow:hidden}.photo{position:relative;background:#252d38;min-height:360px;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.photo .stars{position:absolute;bottom:0;left:0;width:100%;background:#0e1116dd;padding:8px 3px;text-align:center;color:var(--color);font-size:11px;letter-spacing:-1px}.settings{padding:10px;min-width:0}.heading{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:10px}.heading strong{font-size:16px;overflow-wrap:anywhere}.owned{white-space:nowrap;font-size:11px;color:#c3cdd9;display:flex;align-items:center;gap:3px}.owned input{accent-color:#edf2f7}.basic{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px}.field span,.section-title{font-size:10px;color:#9eabba}.field input,.field select{width:100%;height:29px}.section{border-top:1px solid #303a48;margin-top:10px;padding-top:8px}.section-title{margin-bottom:6px;letter-spacing:1px}.row{display:grid;grid-template-columns:minmax(0,1fr) 66px;align-items:center;gap:5px;margin-top:5px;font-size:11px;line-height:1.35}.row span{overflow-wrap:anywhere}.row select{width:100%;font-size:11px;height:29px}.skill-level{display:flex;justify-content:space-between;align-items:center;font-size:11px}.skill-level select{width:66px;font-size:11px;height:29px}.disabled{opacity:.35;pointer-events:none}footer{margin-top:16px;color:#9eabba;font-size:12px}@media(max-width:700px){main{padding:14px}.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex:1}.settings{padding:9px}}


.heading strong{font-size:24px;font-weight:800;line-height:1.2}.heading{align-items:flex-start}.basic{grid-template-columns:1fr 1fr;align-items:end}.cycle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;background:transparent;border:1px solid #3a4556;min-height:56px;width:100%;font-size:11px}.cycle img{width:38px;height:38px;object-fit:contain;pointer-events:none}.cycle:hover{border-color:#eef2f7;background:#222c39}.cycle:focus-visible{outline:2px solid white;outline-offset:2px}.cycle .rank{font-size:10px;color:#b4c0d0}.slot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}.slot-title{display:block;text-align:center;font-size:11px;color:#c4ceda;margin-bottom:4px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.module-grid select{width:100%;font-size:10px;padding:5px 1px;height:29px}.modules .slot-title{font-size:12px}.field span{font-size:11px}.skill-level{margin-bottom:2px}.basic .field input{height:32px}.photo{min-height:360px}.section{margin-top:9px}.owned{padding-top:4px}


.card{height:auto;min-height:var(--card-height,402px)}.photo{height:100%;min-height:0;position:relative}.photo>img{position:absolute;inset:0}.settings{overflow:visible;align-self:start}.cycle{width:56px;height:56px;min-height:56px;border:0;background:transparent;padding:3px;gap:0;flex:none}.cycle:hover{background:transparent;filter:drop-shadow(0 0 4px #ffffff65)}.cycle img{width:38px;height:38px}.basic .cycle{align-self:flex-start}.cycle .rank{font-size:11px;color:#c4ceda}.slot-grid>div{display:flex;flex-direction:column;align-items:center}.slot-grid .slot-title{display:none}.slot-grid .cycle{justify-content:center}.slot-grid .cycle[style]{font-size:10px}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}

.card{padding:0}.settings{min-width:0}.home-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid #3a4556}.home-button svg{width:24px;height:24px}.top{justify-content:flex-start}.nav{margin-left:auto;flex-wrap:wrap}.settings .name{font-size:24px;line-height:1.2;overflow-wrap:anywhere}.skill-empty{color:#7c8795;font-size:11px}.cycle:disabled{opacity:.35;cursor:default;filter:none}.progress-body.is-disabled{opacity:.42}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo .avatar-fallback{position:absolute;inset:0;width:100%;height:100%}.cycle img{width:38px;height:38px}.cycle{flex-shrink:0}@media(max-width:700px){.wrap{padding:14px}.search{min-width:0;width:100%}}

.section.modules{display:block}.cycle img{filter:none}.cycle[data-kind="potential"][data-value="6"]{position:relative}.cycle[data-kind="potential"][data-value="6"] img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:55.1px;height:55.1px;max-width:none}.r1{--color:#7d8794}.r2{--color:#c2ef57}.r3{--color:#58a9e6}.r4{--color:#a878e8}.r5{--color:#e5b84b}.r6{--color:#e86f42}
</style>

<body>
<div class="wrap">
<div class="top">
<a class="home-button" href="index.html" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/></svg></a><div><h1>오퍼레이터 관리</h1><div class="muted">보유 및 육성 현황은 이 브라우저에 자동 저장됩니다.</div></div>
<div class="nav"><button class="btn" id="exportJson">백업</button><button class="btn" id="importJson">복원</button><button class="btn" id="exportPng">전체 PNG</button></div>
</div>
<div class="panel">
<div class="controls">
<input class="search" id="q" placeholder="오퍼레이터 검색">
<select id="rarity"><option value="">전체 등급</option><option>6</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
<select id="ownedFilter"><option value="">전체</option><option value="1">보유</option><option value="0">미보유</option></select>
<button class="btn" id="ownedAll">현재 목록 모두 보유</button>
</div>
<div class="stats" id="stats"></div>
</div>
<div class="grid" id="grid"><div class="muted">오퍼레이터 데이터를 불러오는 중입니다.</div></div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="exportBox" class="exportBox"><h1>명일방주 오퍼레이터 육성 현황</h1><div id="exportSummary"></div><div class="exportGrid" id="exportGrid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const DATA_URL='data/operators.json';
const SAVE_KEY='arknightsOperatorProgressV1';
let chars=[], state={};
try{state=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}catch{state={}}
const save=()=>localStorage.setItem(SAVE_KEY,JSON.stringify(state));
const rarityNum=v=>+(String(v||'').match(/\d+/)||[0])[0];
const maxFallback={0:50,1:80,2:90};
const professionKo={PIONEER:'뱅가드',WARRIOR:'가드',TANK:'디펜더',SNIPER:'스나이퍼',CASTER:'캐스터',MEDIC:'메딕',SUPPORT:'서포터',SPECIAL:'스페셜리스트'};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function def(){return{owned:false,elite:0,level:1,potential:1,trust:0,skill:1,m:[0,0,0],mods:{X:0,Y:0,D:0}}}
function get(id){
 const existing=state[id];
 if(!existing||typeof existing!=='object'||Array.isArray(existing))return state[id]=def();
 return state[id]={...def(),...existing,m:Array.isArray(existing.m)?existing.m.slice():[0,0,0],mods:{...def().mods,...existing.mods}};
}
function maxLv(c,e){return c.phases[e]?.maxLevel||c.phases[0].maxLevel}
function avatar(id){return `https://raw.githubusercontent.com/ArknightsAssets/ArknightsAssets2/cn/assets/dyn/arts/charportraits/${id}_1.png`}
function moduleType(m){return m.type==='D'?'Δ':m.type}
function moduleStage(s,m){return +(s.mods[m.id]??s.mods[m.type]??0)}
function moduleUnlocked(c,s,m){return s.elite>=+(String(m.unlockPhase).match(/\d+/)||[2])[0]&&s.level>=(m.unlockLevel||1)}
function masteryUnlocked(s){return s.elite===2&&s.skill===7}
function clamp(n,min,max){return Math.min(max,Math.max(min,Number.isFinite(+n)?Math.trunc(+n):min))}
function setVal(id,k,v){
 const c=chars.find(c=>c.id===id),s=get(id);if(!c)return;
 if(k==='owned')s.owned=!!v;
 else if(k==='elite'){s.elite=clamp(v,0,c.phases.length-1);s.level=clamp(s.level,1,maxLv(c,s.elite));s.skill=clamp(s.skill,1,s.elite?7:4)}
 else if(k==='level')s.level=clamp(v,1,maxLv(c,s.elite));
 else if(k==='potential')s.potential=clamp(v,1,(c.maxPotentialLevel??5)+1);
 else if(k==='trust')s.trust=clamp(v,0,200);
 else if(k==='skill')s.skill=clamp(v,1,s.elite?7:4);
 else if(k.startsWith('mod:')){const m=c.modules.find(m=>m.id===k.slice(4));if(m&&moduleUnlocked(c,s,m))s.mods[m.id]=clamp(v,0,3)}
 else if(/^m\d$/.test(k)){const i=+k[1];if(c.skills[i]?.mastery.length&&masteryUnlocked(s))s.m[i]=clamp(v,0,3)}
 if(k!=='owned'){
  if(!masteryUnlocked(s))s.m=s.m.map(()=>0);
  for(const m of c.modules)if(!moduleUnlocked(c,s,m)){s.mods[m.id]=0;s.mods[m.type]=0}
 }
 save();updateStats();
}
function iconButton(kind,key,value,label,disabled=false,bottom=''){
 const prefix={elite:'elite-e',potential:'potential-p',mastery:'mastery-m'}[kind];
 return `<button type="button" class="cycle" data-k="${key}" data-kind="${kind}" data-value="${value}" ${disabled?'disabled':''} aria-label="${esc(label)}" title="${esc(label)}"><img src="assets/icons/progress/${prefix}${value}.svg" alt=""><span class="rank">${bottom}</span></button>`;
}
function card(c){
 const s=get(c.id),r=c.rarity,e=clamp(s.elite,0,c.phases.length-1),max=maxLv(c,e);
 return `<article class="card r${r}" data-id="${c.id}" data-name="${esc(c.name.toLowerCase())}" data-r="${r}" data-owned="${s.owned?1:0}"><div class="photo"><img src="${avatar(c.id)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="avatar-fallback" style="display:none">${esc(c.name.slice(0,1))}</div><div class="stars">${'★'.repeat(r)}</div></div><div class="settings"><div class="heading"><strong class="name">${esc(c.name)}</strong><label class="owned"><input type="checkbox" data-k="owned" ${s.owned?'checked':''}>보유</label></div><div class="progress-body ${s.owned?'':'is-disabled'}"><div class="basic"><div class="field"><span>정예화</span>${iconButton('elite','elite',e,`정예화 E${e} · 클릭하여 다음 단계`,c.phases.length===1||!s.owned)}</div><label class="field"><span>레벨</span><input type="number" min="1" max="${max}" value="${clamp(s.level,1,max)}" data-k="level" ${s.owned?'':'disabled'}></label><div class="field"><span>잠재</span>${iconButton('potential','potential',clamp(s.potential,1,6),`잠재 ${s.potential} · 클릭하여 다음 단계`,!s.owned)}</div><label class="field"><span>신뢰도 %</span><input type="number" min="0" max="200" value="${s.trust}" data-k="trust" ${s.owned?'':'disabled'}></label></div>${c.skills.length?`<div class="section"><div class="skill-level"><span>스킬 레벨</span><select data-k="skill" aria-label="스킬 레벨" ${s.owned?'':'disabled'}>${Array.from({length:e?7:4},(_,i)=>i+1).map(v=>`<option value="${v}" ${s.skill===v?'selected':''}>Lv.${v}</option>`).join('')}</select></div><div class="slot-grid">${c.skills.map((sk,i)=>`<div>${sk.mastery.length?iconButton('mastery','m'+i,clamp(s.m[i]||0,0,3),`S${sk.index} 마스터리 M${s.m[i]||0}${masteryUnlocked(s)?' · 클릭하여 다음 단계':' · E2, 스킬 레벨 7 필요'}`,!s.owned||!masteryUnlocked(s),'S'+sk.index):`<div class="cycle skill-empty" title="마스터리가 없는 스킬"><span>—</span><span class="rank">S${sk.index}</span></div>`}</div>`).join('')}</div></div>`:''}${c.modules.length?`<div class="section modules"><div class="section-title">모듈</div><div class="module-grid">${c.modules.map(m=>`<label><span class="slot-title">${moduleType(m)}</span><select data-k="mod:${m.id}" aria-label="모듈 ${moduleType(m)} 스테이지" title="E2 Lv.${m.unlockLevel} 필요" ${s.owned&&moduleUnlocked(c,s,m)?'':'disabled'}>${[0,1,2,3].map(v=>`<option value="${v}" ${moduleStage(s,m)===v?'selected':''}>${v?'Stage '+v:'미해금'}</option>`).join('')}</select></label>`).join('')}</div></div>`:''}</div></div></article>`;
}
function bind(){document.querySelectorAll('.card').forEach(el=>{
 const id=el.dataset.id,c=chars.find(c=>c.id===id);
 el.querySelectorAll('[data-k]').forEach(inp=>{
  if(inp.tagName==='BUTTON')inp.onclick=()=>{const s=get(id),k=inp.dataset.k;const next=k==='elite'?(+s.elite+1)%c.phases.length:k==='potential'?(+s.potential%((c.maxPotentialLevel??5)+1))+1:((+s.m[+k[1]]||0)+1)%4;setVal(id,k,next);refreshCard(el,c)};
  else {
   inp.onchange=()=>{setVal(id,inp.dataset.k,inp.dataset.k==='owned'?inp.checked:inp.value);refreshCard(el,c)};
   if(inp.type==='number')inp.oninput=()=>{setVal(id,inp.dataset.k,inp.value);const s=get(id);el.querySelectorAll('[data-k^="mod:"]').forEach(select=>{const m=c.modules.find(m=>'mod:'+m.id===select.dataset.k);select.disabled=!s.owned||!moduleUnlocked(c,s,m)})};
  }
 });
})}
function refreshCard(el,c){el.outerHTML=card(c);bind();applyFilter();fitCards()}
function fitCards(){const grid=document.getElementById('grid');grid.style.removeProperty('--card-height');const hidden=[...grid.querySelectorAll('.card.hidden')];hidden.forEach(c=>c.classList.remove('hidden'));const panels=[...grid.querySelectorAll('.settings')];const height=Math.max(402,...panels.map(p=>Math.ceil(p.getBoundingClientRect().height)+4));grid.style.setProperty('--card-height',height+'px');hidden.forEach(c=>c.classList.add('hidden'))}
function render(){document.getElementById('grid').innerHTML=chars.map(card).join('');bind();fitCards();applyFilter();updateStats()}

function applyFilter(){
 const q=document.getElementById('q').value.trim().toLowerCase(),r=document.getElementById('rarity').value,o=document.getElementById('ownedFilter').value;
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',!!((q&&!c.dataset.name.includes(q))||(r&&c.dataset.r!==r)||(o!==''&&c.dataset.owned!==o))));fitCards()
}
function updateStats(){
 const total=chars.length,owned=chars.filter(c=>get(c.id).owned).length,e2=chars.filter(c=>get(c.id).owned&&get(c.id).elite===2).length,m3=chars.filter(c=>get(c.id).owned&&get(c.id).m.some(x=>x===3)).length,mod3=chars.filter(c=>get(c.id).owned&&Object.values(get(c.id).mods).some(x=>x===3)).length;
 document.getElementById('stats').innerHTML=[['전체',total],['보유',owned],['E2',e2],['M3 보유',m3],['모듈 3단계',mod3]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('')
}
window.addEventListener('resize',fitCards);document.fonts?.ready.then(fitCards);
['q','rarity','ownedFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',applyFilter));
document.getElementById('ownedAll').onclick=()=>{document.querySelectorAll('.card:not(.hidden)').forEach(c=>{get(c.dataset.id).owned=true});save();render()}
document.getElementById('exportJson').onclick=()=>{const b=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='arknights-operator-backup.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importJson').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());state=j.state||j;save();render();alert('복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''}
function exportCard(c){const s=get(c.id);return `<div class="exportCard r${c.rarity}"><div class="stars">${'★'.repeat(c.rarity)}</div><div class="nm">${esc(c.name)}</div><div class="exportSmall">${s.owned?'보유':'미보유'} · E${s.elite} Lv.${s.level}<br>잠재 ${s.potential} · 신뢰도 ${s.trust}% · Skill ${s.skill}<br>${c.skills.map((sk,i)=>`S${sk.index} M${s.m[i]||0}`).join(' · ')}<br>${c.modules.map(m=>`Module ${moduleType(m)} ${moduleStage(s,m)}`).join(' / ')}</div></div>`}
document.getElementById('exportPng').onclick=async()=>{if(!window.html2canvas)return alert('PNG 모듈을 불러오지 못했습니다.');const owned=chars.filter(c=>get(c.id).owned);document.getElementById('exportSummary').innerHTML=`<p>보유 ${owned.length} / 전체 ${chars.length}</p>`;document.getElementById('exportGrid').innerHTML=chars.map(exportCard).join('');const box=document.getElementById('exportBox');box.style.left='0';box.style.position='fixed';box.style.zIndex='9999';const canvas=await html2canvas(box,{backgroundColor:'#0e1116',scale:1});box.style.left='-100000px';box.style.position='absolute';const a=document.createElement('a');a.download='arknights-operator-progress.png';a.href=canvas.toDataURL('image/png');a.click()}
fetch(DATA_URL).then(r=>r.json()).then(data=>{chars=(data.operators||[]).map(v=>({...v,rarity:+v.rarity})).filter(c=>c.id&&c.name&&c.rarity>=1&&c.rarity<=6&&c.profession&&c.phases?.length).sort((a,b)=>b.rarity-a.rarity||String(a.name).localeCompare(String(b.name),'ko'));render()}).catch(()=>document.getElementById('grid').innerHTML='<div class="muted">저장된 오퍼레이터 데이터 파일을 불러오지 못했습니다.</div>');
</script>
</body></html>
