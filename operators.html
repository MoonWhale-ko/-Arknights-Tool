<div class="wrap">

<div class="nav"><button class="btn" id="gameImport">게임 계정 가져오기</button><button class="btn" id="exportJson">백업</button><button class="btn" id="importJson">복원</button><button class="btn" id="exportPng">PNG 출력 설정</button></div>

</div><div class="png-field-options" aria-label="표시 정보"><label><input type="checkbox" id="png-field-elite" checked>정예화</label><label><input type="checkbox" id="png-field-level" checked>레벨</label><label><input type="checkbox" id="png-field-potential" checked>잠재</label><label><input type="checkbox" id="png-field-trust" checked>신뢰도</label><label><input type="checkbox" id="png-field-skill" checked>스킬 레벨</label><label><input type="checkbox" id="png-field-mastery" checked>마스터리</label><label><input type="checkbox" id="png-field-modules" checked>모듈</label></div></fieldset>
<p class="muted">보유한 오퍼레이터를 레어도(6성→1성) · 직군 · 가나다순으로 출력합니다. 긴 이미지는 자동 분할됩니다. 미리보기는 첫 번째 이미지입니다.</p>

<div id="pngDownloads" class="png-downloads"></div>

<h2 id="accountTitle">게임 계정 가져오기</h2>
<p class="muted">한국 서버 · 요스타 이메일 인증</p>
<p>조회하면 현재 게임 접속이 종료될 수 있습니다. 이메일과 인증번호는 계정 조회에만 사용하며, 육성·재료 정보는 이 브라우저에 저장합니다.</p>

<label>요스타 연동 이메일<input id="accountEmail" type="email" autocomplete="off" maxlength="254" required></label>
<button class="btn" id="accountSend" type="button">인증번호 받기</button>
<label>인증번호<input id="accountCode" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required></label>
<button class="btn" id="accountFetch" type="submit">현재 상태 조회</button>
</form>
<div id="accountMessage" class="account-message" role="status" aria-live="polite"></div>
<div class="account-actions"><button class="btn" id="accountApply" disabled>조회 결과 적용</button><button class="btn" id="accountUndo">가져오기 전으로 복원</button><button class="btn" id="accountClose">닫기</button></div>
</dialog>

<script>
const DATA_URL='data/operators.json';

let chars=[], state={},branchNames={};
let selectedProfession='',selectedBranch='';
let selectedRarities=new Set([6,5,4,3,2,1]);
try{state=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}catch{state={}}
const save=()=>localStorage.setItem(SAVE_KEY,JSON.stringify(state));
const rarityNum=v=>+(String(v||'').match(/\d+/)||[0])[0];
const maxFallback={0:50,1:80,2:90};
const CLASS_ICON_POS={"class_PIONEER":[0,0],"class_WARRIOR":[1,0],"class_TANK":[2,0],"class_SNIPER":[3,0],"class_CASTER":[4,0],"class_MEDIC":[5,0],"class_SUPPORT":[6,0],"class_SPECIAL":[7,0],"sub_agent":[0,1],"sub_alchemist":[1,1],"sub_aoesniper":[2,1],"sub_artsfghter":[3,1],"sub_artsprotector":[4,1],"sub_bard":[5,1],"sub_bearer":[6,1],"sub_blastcaster":[7,1],"sub_blessing":[0,2],"sub_bombarder":[1,2],"sub_centurion":[2,2],"sub_chain":[3,2],"sub_chainhealer":[4,2],"sub_charger":[5,2],"sub_closerange":[6,2],"sub_corecaster":[7,2],"sub_counsellor":[0,3],"sub_craftsman":[1,3],"sub_crusher":[2,3],"sub_dollkeeper":[3,3],"sub_duelist":[4,3],"sub_executor":[5,3],"sub_fastshot":[6,3],"sub_fearless":[7,3],"sub_fighter":[0,4],"sub_fortress":[1,4],"sub_funnel":[2,4],"sub_geek":[3,4],"sub_guardian":[4,4],"sub_hammer":[5,4],"sub_healer":[6,4],"sub_hookmaster":[7,4],"sub_hunter":[0,5],"sub_incantationmedic":[1,5],"sub_instructor":[2,5],"sub_librator":[3,5],"sub_longrange":[4,5],"sub_loopshooter":[5,5],"sub_lord":[6,5],"sub_mercenary":[7,5],"sub_merchant":[0,6],"sub_musha":[1,6],"sub_mystic":[2,6],"sub_phalanx":[3,6],"sub_physician":[4,6],"sub_pioneer":[5,6],"sub_primcaster":[6,6],"sub_primguard":[7,6],"sub_primprotector":[0,7],"sub_protector":[1,7],"sub_pusher":[2,7],"sub_reaper":[3,7],"sub_reaperrange":[4,7],"sub_ringhealer":[5,7],"sub_ritualist":[6,7],"sub_shotprotector":[7,7],"sub_siegesniper":[0,8],"sub_skybreaker":[1,8],"sub_skywalker":[2,8],"sub_slower":[3,8],"sub_soulcaster":[4,8],"sub_splashcaster":[5,8],"sub_stalker":[6,8],"sub_summoner":[7,8],"sub_sword":[0,9],"sub_tactician":[1,9],"sub_traper":[2,9],"sub_underminer":[3,9],"sub_unyield":[4,9],"sub_wandermedic":[5,9],"sub_watchman":[6,9]};
const professionKo={PIONEER:'뱅가드',WARRIOR:'가드',TANK:'디펜더',SNIPER:'스나이퍼',CASTER:'캐스터',MEDIC:'메딕',SUPPORT:'서포터',SPECIAL:'스페셜리스트'};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function def(){return{owned:false,elite:0,level:1,potential:1,trust:0,skill:1,m:[0,0,0],mods:{X:0,Y:0,D:0}}}
function get(id){
 const existing=state[id];
 if(!existing||typeof existing!=='object'||Array.isArray(existing))return state[id]=def();
 return state[id]={...def(),...existing,m:Array.isArray(existing.m)?existing.m.slice():[0,0,0],mods:{...def().mods,...existing.mods}};
}
function maxLv(c,e){return c.phases[e]?.maxLevel||c.phases[0].maxLevel}
function avatar(id){return `https://raw.githubusercontent.com/ArknightsAssets/ArknightsAssets2/cn/assets/dyn/arts/charportraits/${id}_1.png`}
function moduleType(m){return m.type==='D'?'Δ':m.type}
function moduleStage(s,m){return +(s.mods[m.id]??s.mods[m.type]??0)}
function moduleUnlocked(c,s,m){return s.elite>=+(String(m.unlockPhase).match(/\d+/)||[2])[0]&&s.level>=(m.unlockLevel||1)}
function masteryUnlocked(s){return s.elite===2&&s.skill===7}
function clamp(n,min,max){return Math.min(max,Math.max(min,Number.isFinite(+n)?Math.trunc(+n):min))}
function setVal(id,k,v){
 const c=chars.find(c=>c.id===id),s=get(id);if(!c)return;
 if(k==='owned')s.owned=!!v;
 else if(k==='elite'){s.elite=clamp(v,0,c.phases.length-1);s.level=clamp(s.level,1,maxLv(c,s.elite));s.skill=clamp(s.skill,1,s.elite?7:4)}
 else if(k==='level')s.level=clamp(v,1,maxLv(c,s.elite));
 else if(k==='potential')s.potential=clamp(v,1,(c.maxPotentialLevel??5)+1);
 else if(k==='trust')s.trust=clamp(v,0,200);
 else if(k==='skill')s.skill=clamp(v,1,s.elite?7:4);
 else if(k.startsWith('mod:')){const m=c.modules.find(m=>m.id===k.slice(4));if(m&&moduleUnlocked(c,s,m))s.mods[m.id]=clamp(v,0,3)}
 else if(/^m\d$/.test(k)){const i=+k[1];if(c.skills[i]?.mastery.length&&masteryUnlocked(s))s.m[i]=clamp(v,0,3)}
 if(k!=='owned'){
  if(!masteryUnlocked(s))s.m=s.m.map(()=>0);
  for(const m of c.modules)if(!moduleUnlocked(c,s,m)){s.mods[m.id]=0;s.mods[m.type]=0}
 }
 save();updateStats();
}
function iconButton(kind,key,value,label,disabled=false,bottom=''){
 const prefix={elite:'elite-e',potential:'potential-p',mastery:'mastery-m'}[kind];
 return `<button type="button" class="cycle" data-k="${key}" data-kind="${kind}" data-value="${value}" ${disabled?'disabled':''} aria-label="${esc(label)}" title="${esc(label)}"><img src="assets/icons/progress/${prefix}${value}.svg" alt=""><span class="rank">${bottom}</span></button>`;
}
function classGlyph(key){const pos=CLASS_ICON_POS[key];return pos?`<span class="class-glyph" aria-hidden="true" style="--icon-x:${-pos[0]};--icon-y:${-pos[1]}"></span>`:''}
function classificationButton(id,label,key,selected){return `<button type="button" class="class-tab" data-class="${esc(id)}" aria-pressed="${selected}" title="${esc(label)}">${classGlyph(key)}<span>${esc(label)}</span></button>`}
function branchesFor(profession){
 const order=profession==='PIONEER'?['pioneer','charger','bearer','tactician','agent','counsellor']:[];
 return [...new Map(chars.filter(c=>c.profession===profession).map(c=>[c.subProfessionId,branchNames[c.subProfessionId]||c.subProfessionId])).entries()].sort((a,b)=>order.length?order.indexOf(a[0])-order.indexOf(b[0]):a[1].localeCompare(b[1],'ko'));
}
function renderClassification(){
 document.getElementById('professionTabs').innerHTML=classificationButton('','전체','',selectedProfession==='')+Object.entries(professionKo).map(([id,label])=>classificationButton(id,label,'class_'+id,selectedProfession===id)).join('');
 document.getElementById('branchTabs').innerHTML=selectedProfession?classificationButton('','전체','',selectedBranch==='')+branchesFor(selectedProfession).map(([id,label])=>classificationButton(id,label,'sub_'+id,selectedBranch===id)).join(''):'';
 document.getElementById('branchTabs').hidden=!selectedProfession;
}
function syncRaritySelection(){
 const values=[6,5,4,3,2,1].filter(r=>selectedRarities.has(r));
 document.getElementById('rarity').value=values.length===6?'':values.length?values.join(','):'none';
 document.getElementById('rarityButton').textContent=(values.length===6?'전체 등급':values.length?values.join('·')+'성':'등급 선택')+' ▾';
 document.getElementById('rarityOptions').innerHTML=[6,5,4,3,2,1].map(r=>`<button type="button" class="rarity-toggle r${r}" data-rarity="${r}" aria-label="${r}성" aria-pressed="${selectedRarities.has(r)}">${r}성</button>`).join('');
}
function toggleRarity(r){if(selectedRarities.has(r))selectedRarities.delete(r);else selectedRarities.add(r);syncRaritySelection();applyFilter()}
function closeRarityMenu(){document.getElementById('rarityMenu').hidden=true;document.getElementById('rarityButton').setAttribute('aria-expanded','false')}
function matchesOperator(c,q,r,o){return !(q&&!c.name.toLowerCase().includes(q)||r&&!r.split(',').includes(String(c.rarity))||o!==''&&String(+get(c.id).owned)!==o||selectedProfession&&c.profession!==selectedProfession||selectedBranch&&c.subProfessionId!==selectedBranch)}
function groupedCards(){return [6,5,4,3,2,1].map(r=>{const list=chars.filter(c=>c.rarity===r);return list.length?`<section class="rarity-group r${r}" data-rarity="${r}" aria-label="${r}성"><h2 class="rarity-heading">${'★'.repeat(r)}</h2><div class="grid rarity-grid">${list.map(card).join('')}</div></section>`:''}).join('')+'<div id="emptyList" class="muted empty-list hidden" role="status">조건에 맞는 오퍼레이터가 없습니다.</div>'}
function professionBadges(c){
 const icons=[['class_'+c.profession,professionKo[c.profession]||c.profession,''],['sub_'+c.subProfessionId,branchNames[c.subProfessionId]||'세부 직군 '+c.subProfessionId,' branch']];
 return `<div class="profession-badges">${icons.map(([key,label,kind])=>{const pos=CLASS_ICON_POS[key];return pos?`<span class="profession-mark${kind}" role="img" aria-label="${esc(label)}" title="${esc(label)}"><span class="class-glyph" style="--icon-x:${-pos[0]};--icon-y:${-pos[1]}"></span></span>`:''}).join('')}</div>`;
}
function card(c){
 const s=get(c.id),r=c.rarity,e=clamp(s.elite,0,c.phases.length-1),max=maxLv(c,e);
 return `<article class="card r${r}" data-id="${c.id}" data-name="${esc(c.name.toLowerCase())}" data-r="${r}" data-owned="${s.owned?1:0}" data-profession="${c.profession}" data-branch="${c.subProfessionId}"><div class="photo"><img src="${avatar(c.id)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="avatar-fallback" style="display:none">${esc(c.name.slice(0,1))}</div>${professionBadges(c)}</div><div class="settings"><div class="heading"><strong class="name">${esc(c.name)}</strong><label class="owned"><input type="checkbox" data-k="owned" ${s.owned?'checked':''}>보유</label></div><div class="stars">${'★'.repeat(r)}</div><div class="progress-body ${s.owned?'':'is-disabled'}"><div class="basic"><div class="field">${iconButton('elite','elite',e,`정예화 E${e} · 클릭하여 다음 단계`,c.phases.length===1||!s.owned)}</div><label class="field"><span>레벨</span><input type="number" min="1" max="${max}" value="${clamp(s.level,1,max)}" data-k="level" ${s.owned?'':'disabled'}></label><div class="field">${iconButton('potential','potential',clamp(s.potential,1,6),`잠재 ${s.potential} · 클릭하여 다음 단계`,!s.owned)}</div><label class="field"><span>신뢰도 %</span><input type="number" min="0" max="200" value="${s.trust}" data-k="trust" ${s.owned?'':'disabled'}></label></div>${c.skills.length?`<div class="section"><div class="skill-level"><span>스킬 레벨</span><select data-k="skill" aria-label="스킬 레벨" ${s.owned?'':'disabled'}>${Array.from({length:e?7:4},(_,i)=>i+1).map(v=>`<option value="${v}" ${s.skill===v?'selected':''}>Lv.${v}</option>`).join('')}</select></div><div class="slot-grid">${c.skills.map((sk,i)=>`<div>${sk.mastery.length?iconButton('mastery','m'+i,clamp(s.m[i]||0,0,3),`S${sk.index} 마스터리 M${s.m[i]||0}${masteryUnlocked(s)?' · 클릭하여 다음 단계':' · E2, 스킬 레벨 7 필요'}`,!s.owned||!masteryUnlocked(s),'S'+sk.index):`<div class="cycle skill-empty" title="마스터리가 없는 스킬"><span>—</span><span class="rank">S${sk.index}</span></div>`}</div>`).join('')}</div></div>`:''}${c.modules.length?`<div class="section modules"><div class="section-title">모듈</div><div class="module-grid">${c.modules.map(m=>`<label><span class="slot-title">${moduleType(m)}</span><select data-k="mod:${m.id}" aria-label="모듈 ${moduleType(m)} 스테이지" title="E2 Lv.${m.unlockLevel} 필요" ${s.owned&&moduleUnlocked(c,s,m)?'':'disabled'}>${[0,1,2,3].map(v=>`<option value="${v}" ${moduleStage(s,m)===v?'selected':''}>${v?'Stage '+v:'미해금'}</option>`).join('')}</select></label>`).join('')}</div></div>`:''}</div></div></article>`;
}
function bind(){document.querySelectorAll('.card').forEach(el=>{
 const id=el.dataset.id,c=chars.find(c=>c.id===id);
 el.querySelectorAll('[data-k]').forEach(inp=>{
  if(inp.tagName==='BUTTON')inp.onclick=()=>{const s=get(id),k=inp.dataset.k;const next=k==='elite'?(+s.elite+1)%c.phases.length:k==='potential'?(+s.potential%((c.maxPotentialLevel??5)+1))+1:((+s.m[+k[1]]||0)+1)%4;setVal(id,k,next);refreshCard(el,c)};
  else {
   inp.onchange=()=>{setVal(id,inp.dataset.k,inp.dataset.k==='owned'?inp.checked:inp.value);refreshCard(el,c)};
   if(inp.type==='number')inp.oninput=()=>{setVal(id,inp.dataset.k,inp.value);const s=get(id);el.querySelectorAll('[data-k^="mod:"]').forEach(select=>{const m=c.modules.find(m=>'mod:'+m.id===select.dataset.k);select.disabled=!s.owned||!moduleUnlocked(c,s,m)})};
  }
 });
})}
function refreshCard(el,c){el.outerHTML=card(c);bind();applyFilter();fitCards()}
function fitNames(){document.querySelectorAll('.settings .name').forEach(name=>{name.style.fontSize='24px';for(let size=23;(name.scrollHeight>name.clientHeight+1||name.scrollWidth>name.clientWidth+1)&&size>=10;size--)name.style.fontSize=size+'px'})}
function fitCards(){const grid=document.getElementById('grid');grid.style.removeProperty('--card-height');const hidden=[...grid.querySelectorAll('.card.hidden,.rarity-group.hidden')];hidden.forEach(c=>c.classList.remove('hidden'));fitNames();const panels=[...grid.querySelectorAll('.settings')];const height=Math.max(402,...panels.map(p=>Math.ceil(p.getBoundingClientRect().height)+4));grid.style.setProperty('--card-height',height+'px');hidden.forEach(c=>c.classList.add('hidden'))}
function render(){document.getElementById('grid').innerHTML=groupedCards();renderClassification();bind();applyFilter();updateStats()}

function applyFilter(){
 const q=document.getElementById('q').value.trim().toLowerCase(),r=document.getElementById('rarity').value,o=document.getElementById('ownedFilter').value;
 document.querySelectorAll('.card').forEach(el=>{const c=chars.find(c=>c.id===el.dataset.id);el.classList.toggle('hidden',!matchesOperator(c,q,r,o))});
 document.querySelectorAll('.rarity-group').forEach(group=>group.classList.toggle('hidden',!group.querySelector('.card:not(.hidden)')));
 document.getElementById('emptyList').classList.toggle('hidden',!!document.querySelector('.card:not(.hidden)'));fitCards()
}
function updateStats(){
 const total=chars.length,owned=chars.filter(c=>get(c.id).owned).length,e2=chars.filter(c=>get(c.id).owned&&get(c.id).elite===2).length,m3=chars.filter(c=>get(c.id).owned&&get(c.id).m.some(x=>x===3)).length,mod3=chars.filter(c=>get(c.id).owned&&Object.values(get(c.id).mods).some(x=>x===3)).length;
 document.getElementById('stats').innerHTML=[['전체',total],['보유',owned],['E2',e2],['M3 보유',m3],['모듈 3단계',mod3]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('')
}
window.addEventListener('resize',fitCards);document.fonts?.ready.then(fitCards);
document.getElementById('professionTabs').onclick=e=>{const button=e.target.closest('[data-class]');if(!button)return;selectedProfession=button.dataset.class;selectedBranch='';renderClassification();applyFilter()};
document.getElementById('branchTabs').onclick=e=>{const button=e.target.closest('[data-class]');if(!button)return;selectedBranch=button.dataset.class;renderClassification();applyFilter()};
syncRaritySelection();
document.getElementById('rarityButton').onclick=()=>{const menu=document.getElementById('rarityMenu');menu.hidden=!menu.hidden;document.getElementById('rarityButton').setAttribute('aria-expanded',String(!menu.hidden))};
document.getElementById('rarityOptions').onclick=e=>{const button=e.target.closest('[data-rarity]');if(!button)return;const r=+button.dataset.rarity;toggleRarity(r);document.getElementById('rarityOptions').querySelector(`[data-rarity="${r}"]`)?.focus()};
document.getElementById('rarityAll').onclick=()=>{selectedRarities=new Set([6,5,4,3,2,1]);syncRaritySelection();applyFilter()};
document.getElementById('rarityNone').onclick=()=>{selectedRarities=new Set();syncRaritySelection();applyFilter()};
window.addEventListener('click',e=>{if(!document.getElementById('rarityPicker').contains(e.target))closeRarityMenu()});
document.getElementById('rarityPicker').addEventListener('keydown',e=>{if(e.key==='Escape'){closeRarityMenu();document.getElementById('rarityButton').focus()}});
['q','ownedFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',applyFilter));
document.getElementById('ownedAll').onclick=()=>{document.querySelectorAll('.card:not(.hidden)').forEach(c=>{get(c.dataset.id).owned=true});save();render()}
document.getElementById('exportJson').onclick=()=>{const b=new Blob([JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='arknights-operator-backup.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importJson').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());state=j.state||j;save();render();alert('복원했습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''}
window.operatorAccount={get chars(){return chars},get state(){return state},key:SAVE_KEY,replace(next){state=next;render()}};
Promise.all([fetch(DATA_URL).then(r=>r.json()),fetch('data/professions.json').then(r=>r.json())]).then(([data,classification])=>{branchNames=classification.professions||{};chars=(data.operators||[]).map(v=>({...v,rarity:+v.rarity})).filter(c=>c.id&&c.name&&c.rarity>=1&&c.rarity<=6&&c.profession&&c.phases?.length).sort((a,b)=>b.rarity-a.rarity||String(a.name).localeCompare(String(b.name),'ko'));render()}).catch(()=>document.getElementById('grid').innerHTML='<div class="muted">저장된 오퍼레이터 데이터 파일을 불러오지 못했습니다.</div>');
</script>
