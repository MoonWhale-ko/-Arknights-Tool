<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명일방주 육성 재료</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#eef2f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid #3a4556;background:#1d2430;border-radius:8px;padding:9px 12px}.muted{color:#98a5b5}.panel{background:#171d26;border:1px solid #2d3745;border-radius:14px;padding:16px;margin-top:16px}
input,select{background:#10151c;color:#fff;border:1px solid #3a4556;border-radius:8px;padding:10px}.search{width:min(520px,100%)}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}.costrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid #27303d}.costrow:first-child{border-top:0}.label{min-width:150px;font-weight:800}.items{display:flex;gap:7px;flex-wrap:wrap;flex:1}.item{display:flex;align-items:center;gap:6px;border:1px solid #354052;background:#111720;border-radius:8px;padding:6px 8px}.icon{width:30px;height:30px;object-fit:contain}.count{font-weight:800;color:#f1ca61}.status{padding:30px;text-align:center;color:#9ca8b7}.ophead{display:flex;gap:12px;align-items:center}.portrait{width:86px;height:86px;object-fit:cover;border-radius:10px;background:#252e3a}.stars{color:#f0c75d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module-title{display:flex;gap:8px;align-items:center;margin:16px 0 4px}.module-type{font-size:12px;font-weight:900;border:1px solid #59677a;border-radius:999px;padding:3px 7px;color:#f1c85e}.source{font-size:12px;margin-top:10px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.label{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1 style="margin:0">육성 재료</h1><div class="muted">이 사이트에 저장된 한국 서버 육성 데이터를 사용합니다.</div></div>
<div class="nav"><a href="index.html">홈</a><a href="recruitment.html">공개모집</a><a href="operators.html">오퍼레이터 관리</a></div></div>

<div class="panel">
<input id="search" class="search" list="operatorList" aria-label="오퍼레이터 이름 검색" placeholder="오퍼레이터 이름 검색">
<datalist id="operatorList"></datalist>
<div class="source muted" id="sourceInfo"></div>
</div>
<div id="content"><div class="status">저장된 육성 데이터를 불러오는 중입니다.</div></div>
</div>

<script>
const OPS_URL='data/operators.json';
const ITEMS_URL='data/items.json';
const ASSET='https://raw.githubusercontent.com/fexli/ArknightsResource/main/';
const professionKo={PIONEER:'뱅가드',WARRIOR:'가드',TANK:'디펜더',SNIPER:'스나이퍼',CASTER:'캐스터',MEDIC:'메딕',SUPPORT:'서포터',SPECIAL:'스페셜리스트'};
let operators=[],items={},byName=new Map(),byLabel=new Map();

const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function itemObj(id){return items[String(id)]||{}}
function itemName(id){return itemObj(id).name||String(id)}
function itemIcon(id){
 const o=itemObj(id),icon=o.iconId;
 return icon ? ASSET+'item/'+icon+'.png' : '';
}
function costHtml(cost){
 const a=Array.isArray(cost)?cost:[];
 if(!a.length)return '<span class="muted">없음</span>';
 return a.map(x=>'<div class="item">'+
   (itemIcon(x.id)?'<img class="icon" src="'+itemIcon(x.id)+'" onerror="this.style.display=\'none\'">':'')+
   '<span>'+esc(itemName(x.id))+'</span><span class="count">×'+x.count+'</span></div>').join('');
}
function section(title,rows){
 return '<div class="panel section"><h2>'+title+'</h2>'+
 (rows.length?rows.map(x=>'<div class="costrow"><div class="label">'+esc(x.label)+'</div><div class="items">'+costHtml(x.cost)+'</div></div>').join(''):'<div class="muted">해당 항목 없음</div>')+
 '</div>';
}
function renderModule(m){
 const type=m.type==='D'?'Δ':(m.type||'?');
 return '<div class="module-title"><strong>'+esc(m.name)+'</strong><span class="module-type">'+esc(type)+'</span></div>'+
 '<div class="muted">해금: E'+esc(String(m.unlockPhase).replace('PHASE_',''))+' Lv.'+esc(m.unlockLevel)+'</div>'+
 (m.missions?.length?'<details><summary>모듈 해금 임무</summary><ul>'+m.missions.map(x=>'<li>'+esc(x.description)+'</li>').join('')+'</ul></details>':'')+
 (m.costs?.length?m.costs.map(s=>'<div class="costrow"><div class="label">Stage '+s.stage+'</div><div class="items">'+costHtml(s.cost)+'</div></div>').join(''):'<div class="muted">재료 정보 없음</div>');
}
function renderById(id){
 const c=operators.find(x=>x.id===id);
 if(!c){document.getElementById('content').innerHTML='<div class="status">오퍼레이터를 선택하세요.</div>';return}
 const promo=(c.phases||[]).filter(x=>x.phase>0).map(x=>({label:'E'+x.phase+' 정예화',cost:x.evolveCost||[]}));
 const common=(c.skillLevels||[]).map(x=>({label:'Skill '+x.from+' → '+x.to,cost:x.cost||[]}));
 const master=[];
 (c.skills||[]).forEach(sk=>(sk.mastery||[]).forEach(m=>master.push({label:'S'+sk.index+' '+sk.name+' · M'+m.level,cost:m.cost||[]})));
 const modules=(c.modules||[]);
 document.getElementById('content').innerHTML=
 '<div class="panel"><div class="ophead"><img class="portrait" src="'+ASSET+'charpor/'+c.id+'_1.png" onerror="this.style.visibility=\'hidden\'"><div><div class="stars">'+('★'.repeat(c.rarity))+'</div><h2 style="margin:4px 0">'+esc(c.name)+'</h2><div class="muted">'+esc(professionKo[c.profession]||c.profession||'')+'</div></div></div></div>'+
 '<div class="grid2">'+section('정예화 재료',promo)+section('스킬 레벨 재료',common)+'</div>'+
 section('마스터리 재료',master)+
 '<div class="panel section"><h2>모듈 재료</h2>'+(modules.length?modules.map(renderModule).join(''):'<div class="muted">현재 저장 데이터에 모듈이 없습니다.</div>')+'</div>';
}
function resolveName(name){
 if(byLabel.has(name))return byLabel.get(name);
 const ids=byName.get(name)||[];
 if(ids.length===1)return ids[0];

 return null;
}

Promise.all([
 fetch(OPS_URL,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('operators');return r.json()}),
 fetch(ITEMS_URL,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('items');return r.json()})
]).then(([odata,idata])=>{
 if(odata.version!==2||idata.version!==2||odata.source.commit!==idata.source.commit)throw Error('데이터 버전이 다릅니다. 새로고침해 주세요.');
 operators=odata.operators||[];
 items=idata.items||{};
 for(const o of operators){
   if(!byName.has(o.name))byName.set(o.name,[]);
   byName.get(o.name).push(o.id);
 }
 for(const o of operators){
   const label=byName.get(o.name).length>1?o.name+' ('+(professionKo[o.profession]||o.profession)+')':o.name;
   byLabel.set(label,o.id);
 }
 document.getElementById('operatorList').innerHTML=[...byLabel.keys()].sort((a,b)=>a.localeCompare(b,'ko')).map(n=>'<option value="'+esc(n)+'">').join('');
 document.getElementById('sourceInfo').textContent='저장 데이터: '+operators.length+'명 · 재료 '+Object.keys(items).length+'종 · 원본 갱신 '+odata.source.updatedAt.slice(0,10)+' · '+odata.source.commit.slice(0,7);
 document.getElementById('content').innerHTML='<div class="status">오퍼레이터 이름을 검색해서 선택하세요.</div>';
 const input=document.getElementById('search');
 const go=()=>{const id=resolveName(input.value.trim());renderById(id)};
 const initial=operators.find(o=>o.id===new URLSearchParams(location.search).get('operator'));
 if(initial){input.value=[...byLabel].find(([,id])=>id===initial.id)[0];renderById(initial.id)}
 input.addEventListener('change',go);
 input.addEventListener('input',go);
}).catch(err=>{
 console.error(err);
 document.getElementById('content').innerHTML='<div class="status">저장된 육성 데이터 파일을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
});
</script>
</body>
</html>
