<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명일방주 육성 재료</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#eef2f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid #3a4556;background:#1d2430;border-radius:8px;padding:9px 12px}.muted{color:#98a5b5}.panel{background:#171d26;border:1px solid #2d3745;border-radius:14px;padding:16px;margin-top:16px}
input,select{background:#10151c;color:#fff;border:1px solid #3a4556;border-radius:8px;padding:10px}.search{width:min(460px,100%)}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 10px}.costrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid #27303d}.costrow:first-child{border-top:0}.label{min-width:130px;font-weight:800}.items{display:flex;gap:7px;flex-wrap:wrap}.item{display:flex;align-items:center;gap:6px;border:1px solid #354052;background:#111720;border-radius:8px;padding:6px 8px}.icon{width:30px;height:30px;object-fit:contain}.count{font-weight:800;color:#f1ca61}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid #3b4656;background:#202733;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.tab.on{background:#e8b94c;color:#111;font-weight:900}.status{padding:30px;text-align:center;color:#9ca8b7}.ophead{display:flex;gap:12px;align-items:center}.portrait{width:86px;height:86px;object-fit:cover;border-radius:10px;background:#252e3a}.stars{color:#f0c75d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}.label{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1 style="margin:0">육성 재료</h1><div class="muted">게임 데이터에서 자동으로 불러옵니다.</div></div>
<div class="nav"><a href="index.html">홈</a><a href="recruitment.html">공개모집</a><a href="operators.html">오퍼레이터 관리</a></div></div>
<div class="panel">
<input id="search" class="search" list="operatorList" placeholder="오퍼레이터 이름 검색">
<datalist id="operatorList"></datalist>
</div>
<div id="content"><div class="status">게임 데이터를 불러오는 중입니다.</div></div>
</div>
<script>
const BASE='https://raw.githubusercontent.com/ArknightsAssets/ArknightsGamedata/master/kr/gamedata/excel/';
const CHAR_URL=BASE+'character_table.json';
const ITEM_URL=BASE+'item_table.json';
const ASSET='https://raw.githubusercontent.com/fexli/ArknightsResource/main/';
let chars={}, items={}, byName={};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rarity=v=>+(String(v||'').match(/\d+/)||[0])[0];
function itemObj(id){return items[id]||items[String(id)]||{}}
function itemName(id){return itemObj(id).name||id}
function itemIcon(id){const o=itemObj(id),icon=o.iconId||o.icon_id||id;return ASSET+'item/'+icon+'.png'}
function normalizeCost(arr){
 if(!Array.isArray(arr)) return [];
 return arr.map(x=>({id:x.id||x.itemId||x.item_id,count:x.count??x.quantity??0,type:x.type})).filter(x=>x.id)
}
function costHtml(cost){
 const a=normalizeCost(cost);
 if(!a.length)return '<span class="muted">없음</span>';
 return a.map(x=>'<div class="item"><img class="icon" src="'+itemIcon(x.id)+'" onerror="this.style.display=\'none\'"><span>'+esc(itemName(x.id))+'</span><span class="count">×'+x.count+'</span></div>').join('')
}
function skillCosts(c){
 const rows=[];
 (c.allSkillLvlup||[]).forEach((v,i)=>{
   const cost=v.lvlUpCost||v.levelUpCost||v.cost||[];
   rows.push({label:'Skill '+(i+1)+' → '+(i+2),cost});
 });
 return rows;
}
function masteryRows(c){
 const out=[];
 (c.skills||[]).forEach((sk,si)=>{
   const cond=Array.isArray(sk.levelUpCostCond)?sk.levelUpCostCond:[];
   cond.forEach((v,mi)=>{
     const cost=v.lvlUpCost||v.levelUpCost||v.cost||[];
     out.push({label:'S'+(si+1)+' M'+(mi+1),cost});
   });
 });
 return out;
}
function render(name){
 const c=byName[name]; if(!c){document.getElementById('content').innerHTML='<div class="status">검색할 오퍼레이터를 선택하세요.</div>';return}
 const r=rarity(c.rarity);
 const promo=[];
 if(c.phases?.[1])promo.push({label:'E1 정예화',cost:c.phases[1].evolveCost});
 if(c.phases?.[2])promo.push({label:'E2 정예화',cost:c.phases[2].evolveCost});
 const skills=skillCosts(c), masters=masteryRows(c);
 document.getElementById('content').innerHTML=
 '<div class="panel"><div class="ophead"><img class="portrait" src="'+ASSET+'charpor/'+c.id+'_1.png" onerror="this.style.visibility=\'hidden\'"><div><div class="stars">'+('★'.repeat(r))+'</div><h2 style="margin:4px 0">'+esc(c.name)+'</h2><div class="muted">'+esc(c.profession||'')+'</div></div></div></div>'+
 '<div class="grid2">'+
 section('정예화 재료',promo)+section('스킬 레벨 재료',skills)+
 '</div>'+section('마스터리 재료',masters);
}
function section(title,rows){
 return '<div class="panel section"><h2>'+title+'</h2>'+(rows.length?rows.map(x=>'<div class="costrow"><div class="label">'+esc(x.label)+'</div><div class="items">'+costHtml(x.cost)+'</div></div>').join(''):'<div class="muted">해당 항목 없음</div>')+'</div>'
}
function parseItems(data){
 if(data.items)return data.items;
 if(data.itemDict)return data.itemDict;
 return data;
}
Promise.all([fetch(CHAR_URL).then(r=>{if(!r.ok)throw Error('character');return r.json()}),fetch(ITEM_URL).then(r=>{if(!r.ok)throw Error('item');return r.json()})])
.then(([cdata,idata])=>{
 chars=cdata;items=parseItems(idata);
 Object.entries(chars).forEach(([id,c])=>{if(c&&c.name&&id.startsWith('char_')&&c.phases?.length){c.id=id;byName[c.name]=c}});
 const names=Object.keys(byName).sort((a,b)=>a.localeCompare(b,'ko'));
 document.getElementById('operatorList').innerHTML=names.map(n=>'<option value="'+esc(n)+'">').join('');
 document.getElementById('content').innerHTML='<div class="status">오퍼레이터 이름을 검색해서 선택하세요.</div>';
 document.getElementById('search').addEventListener('change',e=>render(e.target.value.trim()));
 document.getElementById('search').addEventListener('input',e=>{if(byName[e.target.value.trim()])render(e.target.value.trim())});
}).catch(err=>{document.getElementById('content').innerHTML='<div class="status">게임 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';console.error(err)});
</script>
</body></html>
