<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>촬영 데이터 적용</title></head><body><h1>촬영 데이터 적용</h1><p>선택한 보상 기록은 이 브라우저에서만 읽으며 서버로 전송하지 않습니다.</p><input id="captureFile" type="file" accept=".json,application/json" aria-label="촬영 JSON 선택"><p id="message" role="status"></p><script type="module">
const input=document.getElementById('captureFile'),message=document.getElementById('message');
input.addEventListener('change',async()=>{try{const file=input.files[0];if(!file)return;if(file.size>30*1024*1024)throw Error('파일 크기를 확인하세요.');const data=JSON.parse(await file.text()),user=data.user??data.snapshot?.user;if(!user?.dungeon?.stages||!user?.troop?.chars||!user?.campaignsV2?.instances)throw Error('보상 기록이 없는 파일입니다.');localStorage.setItem('arknightsOneTimeRewardsV1',JSON.stringify({importedAt:data.importedAt,user:{dungeon:user.dungeon,medal:user.medal,retro:user.retro,troop:user.troop,campaignsV2:user.campaignsV2}}));location.replace('rewards.html');}catch(error){message.textContent=error.message;}finally{input.value='';}});
</script></body></html>
