 let sets=[];for(let k=1;k<=Math.min(3,selected.length);k++)sets.push(...combo(selected,k));let rows=sets.map(tags=>{let os=operators.filter(o=>eligible(o,tags));let min=os.length?Math.min(...os.map(o=>o.rarity)):0;return{tags,os,min}}).filter(x=>x.os.length);if(document.getElementById('highOnly').checked)rows=rows.filter(x=>x.min>=4);rows.sort((a,b)=>b.min-a.min||a.os.length-b.os.length||b.tags.length-a.tags.length);
 document.getElementById('count').textContent=selected.length?rows.length+'개 조합':'';if(!selected.length){document.getElementById('results').innerHTML='<div class="empty">위에서 공개모집에 표시된 태그를 선택하세요.</div>';return}
 document.getElementById('results').innerHTML=rows.map(r=>`<div class="combo"><div class="combohead"><span class="combo-tags">${r.tags.join(' + ')}</span><span class="grade g${r.min}">최저 ${r.min}★</span></div><div class="ops">${r.os.sort((a,b)=>b.rarity-a.rarity||a.name.localeCompare(b.name,'ko')).map(o=>`<div class="op r${o.rarity}">${o.charId?`<img class="portrait" src="${imgUrl(o)}" alt="${o.name}" loading="lazy">`:''}<div class="optext"><span class="stars">${'★'.repeat(o.rarity)}</span><div class="opname">${o.name}</div></div></div>`).join('')}</div></div>`).join('')||'<div class="empty">현재 설정에서 표시할 조합이 없습니다.</div>';
}
tagBtns.forEach(b=>b.onclick=()=>{let t=b.dataset.tag,i=selected.indexOf(t);if(i>=0)selected.splice(i,1);else if(selected.length<5)selected.push(t);render()});document.getElementById('tagReset').onclick=()=>{selected.length=0;render()};document.querySelectorAll('.rarity').forEach(b=>b.onclick=()=>{let r=+b.dataset.r;if(allowed.has(r)){if(allowed.size===1)return;allowed.delete(r);b.classList.remove('on')}else{allowed.add(r);b.classList.add('on')}saveSettings();render()});document.getElementById('highOnly').onchange=()=>{saveSettings();render()};document.getElementById('reset').onclick=()=>{allowed.clear();[1,2,3,4,5,6].forEach(x=>allowed.add(x));document.querySelectorAll('.rarity').forEach(b=>b.classList.add('on'));document.getElementById('highOnly').checked=false;saveSettings();render()};document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsPanel').classList.toggle('open');document.getElementById('settingsClose').onclick=()=>document.getElementById('settingsPanel').classList.remove('open');
fetch('https://raw.githubusercontent.com/Dimbreath/ArknightsData/master/ko-KR/gamedata/excel/character_table.json').then(r=>r.json()).then(data=>{let byName={};for(const [id,v] of Object.entries(data))if(v&&v.name)byName[v.name]=id;operators.forEach(o=>{if(!o.charId&&byName[o.name])o.charId=byName[o.name]});render()}).catch(()=>{render()});render();
</script></body></html>
