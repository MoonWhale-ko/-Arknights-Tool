<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명일방주 도구 - 공개모집 계산기</title>
<style>
*{box-sizing:border-box;border-radius:0}
:root{color-scheme:dark;--bg:#0e1116;--panel:#171d26;--line:#344154;--text:#eef2f7;--muted:#a1aebe;--accent:#f0c65a}
body{margin:0;background:linear-gradient(180deg,#0d1117,#111722);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
button,a,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page-header{height:72px;padding:16px 24px;display:flex;align-items:center}
.home-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--panel)}.home-button:hover{background:#263140}.home-button svg{width:23px;height:23px}
.workspace{display:grid;grid-template-columns:clamp(290px,calc((100svh - 96px)*9/16),390px) minmax(0,1fr);gap:28px;padding:0 24px 40px;align-items:start}
.tag-panel{aspect-ratio:9/16;container-type:inline-size;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);position:sticky;top:16px;min-width:0}
.tag-header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}.tag-header h1{font-size:clamp(15px,4.8cqw,20px);margin:0;font-weight:750;letter-spacing:-.04em}.badge{color:var(--muted);font-size:12px;white-space:nowrap}
#tagArea{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}.tag-section h3{font-size:12px;font-weight:650;color:var(--muted);margin:0 0 6px}.tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.tag-section:nth-child(2) .tags,.tag-section:last-child .tags{grid-template-columns:repeat(4,minmax(0,1fr))}
.tag{min-height:clamp(28px,9.5cqw,38px);border:1px solid #3c495d;background:#111720;color:#d3dce8;padding:5px 2px;font-size:clamp(10px,3.4cqw,13px);line-height:1.25;word-break:keep-all}.tag:hover{border-color:#7c8da5;background:#243041}.tag.on{background:var(--accent);color:#11151c;border-color:var(--accent);font-weight:800}
.tag-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;margin-top:auto}.tag-reset,.settings-button{min-height:36px;border:1px solid #42516a;background:transparent;color:#c9d5e4;padding:7px 10px;font-size:12px}.tag-reset:hover,.settings-button:hover{background:#263140}.settings-button{display:flex;align-items:center;gap:6px}.settings-button svg{width:16px;height:16px}
.results-panel{min-width:0}.results-header{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:42px;margin-bottom:12px}.results-header h2{margin:0;font-size:20px}.muted{color:var(--muted)}#count{font-size:13px}.empty{border:1px solid var(--line);background:#121923;min-height:220px;padding:40px 20px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;line-height:1.7}
.combo{background:var(--panel);border:1px solid var(--line);margin-bottom:18px}.combohead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#1b2431}.combo-tags{font-size:14px;font-weight:750;color:var(--accent);line-height:1.5}.grade{font-size:12px;font-weight:750;white-space:nowrap}.g1{color:#a0a9b5}.g2{color:#c2ef57}.g3{color:#75b9f0}.g4{color:#c9a8ff}.g5{color:#ffd36b}.g6{color:#ff9a68}
.rarity-group{padding:14px 16px}.rarity-group+.rarity-group{border-top:1px solid var(--line)}.rarity-heading{font-size:11px;font-weight:700;letter-spacing:.1em;margin:0 0 10px;color:var(--muted)}.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 12px}.op{min-width:0;text-align:center;--rarity:#7d8794}.op.r2{--rarity:#c2ef57}.op.r3{--rarity:#58a9e6}.op.r4{--rarity:#a878e8}.op.r5{--rarity:#e5b84b}.op.r6{--rarity:#e86f42}
.portrait-frame{border:2px solid var(--rarity);background:#252c36}.portrait{display:block;width:100%;height:auto}.portrait-fallback{min-height:100px;display:grid;place-items:center;color:#bcc9da;font-size:24px}.op.unowned .portrait-frame{box-shadow:0 0 5px #fff9,0 0 14px #fff5}.rarity-heading.g2{color:#c2ef57}.optext{padding:8px 2px 0}.stars{display:block;font-size:10px;color:var(--rarity);letter-spacing:-1px;margin-bottom:3px}.opname{font-weight:650;font-size:13px;line-height:1.45;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}.opname.long-name{font-size:11px}
.settings-panel{display:none;position:absolute;bottom:62px;right:16px;width:calc(100% - 32px);padding:16px;background:#111822;border:1px solid #596b84;z-index:10;box-shadow:0 12px 36px #0009}.settings-panel.open{display:block}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.settings-head h2{font-size:16px;margin:0}.settings-close{border:0;background:transparent;color:#e5ebf4;font-size:24px;min-width:32px;min-height:32px}.setting-row{padding:12px 0;border-top:1px solid var(--line)}.setting-label{font-size:12px;font-weight:700;margin-bottom:9px}.rarities{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.rarity{min-height:36px;padding:2px;border:1px solid #465163;background:#202a38;color:#c7d2e0;font-size:12px}.rarity.on{background:#eef2f7;color:#111720;border-color:#eef2f7;font-weight:750}.switch{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}.switch input{width:18px;height:18px;accent-color:var(--accent)}.reset{width:100%;border:1px solid #465163;background:transparent;color:#cbd5e2;padding:9px;font-size:12px}
@media(max-width:760px){.page-header{height:60px;padding:10px 12px}.home-button{width:40px;height:40px}.workspace{display:block;padding:0 0 32px}.tag-panel{position:relative;top:auto;width:100%;aspect-ratio:9/16;padding:20px;gap:16px;border-left:0;border-right:0}.tag-header h1{font-size:clamp(20px,5cqw,26px)}.badge{font-size:13px}#tagArea{gap:clamp(12px,4cqw,24px)}.tag-section h3{font-size:13px;margin-bottom:8px}.tags{gap:7px}.tag{min-height:clamp(36px,10cqw,50px);font-size:clamp(11px,3.4cqw,16px)}.tag-reset,.settings-button{min-height:44px;font-size:13px;padding:10px 12px}.results-panel{margin-top:26px;padding:0 12px}.results-header h2{font-size:18px}.empty{min-height:160px}.combohead{padding:12px}.combo-tags{font-size:13px}.rarity-group{padding:12px}.ops{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}.settings-panel{right:20px;bottom:80px;width:calc(100% - 40px);padding:18px}.rarity{min-height:44px}.switch{font-size:13px}}
</style>

</section>

</main>

const selected=[];const saved=(()=>{try{return JSON.parse(localStorage.getItem('akRecruitSettings')||'{}')}catch{return {}}})();const allowed=new Set(Array.isArray(saved.allowed)&&saved.allowed.length?saved.allowed:[1,2,3,4,5,6]);

const tagBtns=[...document.querySelectorAll('.tag')];
function combo(arr,k){let out=[];function f(i,p){if(p.length===k){out.push([...p]);return}for(let j=i;j<arr.length;j++){p.push(arr[j]);f(j+1,p);p.pop()}}f(0,[]);return out}
function eligible(o,tags){if(!allowed.has(o.rarity))return false;if(o.rarity===6&&!tags.includes('고급 특별 채용'))return false;return tags.every(t=>o.tags.includes(t))}
function imgUrl(o){if(!o.charId)return '';return `https://raw.githubusercontent.com/ArknightsAssets/ArknightsAssets2/cn/assets/dyn/arts/charportraits/${o.charId}_1.png`}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readProgress(){try{const p=JSON.parse(localStorage.getItem('arknightsOperatorProgressV1')||'{}');return p&&typeof p==='object'&&!Array.isArray(p)?p:{}}catch{return {}}}
function renderRarityGroups(list,progress){
 const groups=new Map();
 [...list].sort((a,b)=>b.rarity-a.rarity||a.name.localeCompare(b.name,'ko')).forEach(o=>{if(!groups.has(o.rarity))groups.set(o.rarity,[]);groups.get(o.rarity).push(o)});
 return [...groups].map(([rarity,ops])=>`<section class="rarity-group" data-rarity="${rarity}"><h3 class="rarity-heading g${rarity}">${rarity}★</h3><div class="ops">${ops.map(o=>{
  const unowned=!o.charId||progress[o.charId]?.owned!==true;
  return `<div class="op r${o.rarity}${unowned?' unowned':''}" data-id="${esc(o.charId||'')}" aria-label="${esc(o.name)} · ${unowned?'미보유':'보유'}"><div class="portrait-frame">${o.charId?`<img class="portrait" src="${imgUrl(o)}" alt="${esc(o.name)}" loading="lazy">`:`<div class="portrait-fallback" aria-hidden="true">${esc(o.name.slice(0,1))}</div>`}</div><div class="optext"><span class="stars">${'★'.repeat(o.rarity)}</span><div class="opname${o.name.length>8?' long-name':''}">${esc(o.name)}</div></div></div>`;
 }).join('')}</div></section>`).join('');
}
function saveSettings(){localStorage.setItem('akRecruitSettings',JSON.stringify({allowed:[...allowed].sort(),highOnly:document.getElementById('highOnly').checked}))}function render(){document.getElementById('selCount').textContent=selected.length+' / 5';tagBtns.forEach(b=>{const on=selected.includes(b.dataset.tag);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});
 let sets=[];for(let k=1;k<=Math.min(3,selected.length);k++)sets.push(...combo(selected,k));let rows=sets.map(tags=>{let os=operators.filter(o=>eligible(o,tags));let min=os.length?Math.min(...os.map(o=>o.rarity)):0;return{tags,os,min}}).filter(x=>x.os.length);if(document.getElementById('highOnly').checked)rows=rows.filter(x=>x.min>=4);rows.sort((a,b)=>b.min-a.min||a.os.length-b.os.length||b.tags.length-a.tags.length);
 document.getElementById('count').textContent=selected.length?rows.length+'개 조합':'';if(!selected.length){document.getElementById('results').innerHTML='<div class="empty">위에서 공개모집에 표시된 태그를 선택하세요.</div>';return}

 document.getElementById('results').innerHTML=rows.map(r=>`<div class="combo"><div class="combohead"><span class="combo-tags">${r.tags.join(' + ')}</span><span class="grade g${r.min}">최저 ${r.min}★</span></div>${renderRarityGroups(r.os,progress)}</div>`).join('')||'<div class="empty">현재 설정에서 표시할 조합이 없습니다.</div>';

}
tagBtns.forEach(b=>b.onclick=()=>{let t=b.dataset.tag,i=selected.indexOf(t);if(i>=0)selected.splice(i,1);else if(selected.length<5)selected.push(t);render()});document.getElementById('tagReset').onclick=()=>{selected.length=0;render()};document.querySelectorAll('.rarity').forEach(b=>b.onclick=()=>{let r=+b.dataset.r;if(allowed.has(r)){if(allowed.size===1)return;allowed.delete(r);b.classList.remove('on')}else{allowed.add(r);b.classList.add('on')}saveSettings();render()});document.getElementById('highOnly').onchange=()=>{saveSettings();render()};document.getElementById('reset').onclick=()=>{allowed.clear();[1,2,3,4,5,6].forEach(x=>allowed.add(x));document.querySelectorAll('.rarity').forEach(b=>b.classList.add('on'));document.getElementById('highOnly').checked=false;saveSettings();render()};function setSettings(open){document.getElementById('settingsPanel').classList.toggle('open',open);document.getElementById('settingsBtn').setAttribute('aria-expanded',String(open));}
document.getElementById('settingsBtn').onclick=()=>setSettings(!document.getElementById('settingsPanel').classList.contains('open'));document.getElementById('settingsClose').onclick=()=>setSettings(false);
