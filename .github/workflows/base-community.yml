name: Collect validated base recommendations
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: base-community
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BASE_SHARE_CLOUDFLARE_TOKEN }}
      CF_ACCOUNT_ID: '07837cee2afb94e5fd8a3b44486e1bc7'
      CF_DATABASE_ID: 'ad8da28d-4b2c-44e3-a810-ffc08bf103e9'
    steps:
      - uses: actions/checkout@v6
      - name: Check connection
        id: connection
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$CF_DATABASE_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare submission storage is not connected yet."
          fi
      - name: Resume review branch
        if: steps.connection.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git ls-remote --exit-code --heads origin community/base-results; then
            git fetch origin community/base-results
            git checkout -B community/base-results origin/community/base-results
            git merge origin/main --no-edit
          fi
      - name: Export pending submissions
        if: steps.connection.outputs.ready == 'true'
        run: python3 scripts/export_base_submissions.py
      - name: Recalculate and merge recommendations
        if: steps.connection.outputs.ready == 'true'
        run: node scripts/validate_base_submissions.mjs /tmp/base-submissions.json research/base-community.json
      - name: Commit validated results
        if: steps.connection.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/base-community.json
          if ! git diff --cached --quiet; then
            git commit -m "Update validated community base recommendations"
            git push origin HEAD:community/base-results
          fi
