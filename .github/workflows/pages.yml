name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate bundled data
        run: python3 -m unittest discover -s tests -v
      - name: Validate recruitment behavior
        run: node tests/test_recruitment.cjs
      - name: Validate operator progress
        run: node tests/test_operators.cjs
      - name: Validate operator plans
        run: node tests/test_plans.cjs
      - name: Validate growth costs and crafting
        run: node --test tests/test_growth.mjs
      - name: Validate backpack inventory
        run: node --test tests/test_inventory.mjs tests/test_drag_scroll.mjs
      - name: Validate account import
        run: node --test tests/test_account_import.mjs workers/account/test/*.test.mjs
      - name: Validate base optimizer
        run: node --test tests/test_base_optimizer.mjs tests/test_base_integrated.mjs tests/test_guide_tour.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -R assets data research _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


