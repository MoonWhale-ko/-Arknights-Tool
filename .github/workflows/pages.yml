name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate bundled data
        run: python3 -m unittest discover -s tests -v
      - name: Validate recruitment behavior
        run: node tests/test_recruitment.cjs
      - name: Validate operator progress
        run: node tests/test_operators.cjs
      - name: Validate backpack inventory
        run: node --test tests/test_inventory.mjs
      - name: Validate account import
        run: node --test tests/test_account_import.mjs workers/account/test/*.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
