name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate bundled data
        run: python3 -m unittest discover -s tests -v
      - name: Validate recruitment behavior
        run: node tests/test_recruitment.cjs
      - name: Validate operator progress
        run: node tests/test_operators.cjs
      - name: Validate operator plans
        run: node tests/test_plans.cjs
      - name: Validate growth costs and crafting
        run: node --test tests/test_growth.mjs
      - name: Validate backpack inventory
        run: node --test tests/test_inventory.mjs
      - name: Validate account import
        run: node --test tests/test_account_import.mjs workers/account/test/*.test.mjs
      - name: Clear stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"] + "/pages/deployments/062f5d4d3b249db58d349c5f66a2449833cc0ddf"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2026-03-10"}
          def call(url, method="GET"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data else {}
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return {"status": "not_found"}
                  raise
          state = call(base).get("status")
          print("Previous Pages deployment:", state)
          terminal = {"succeed", "failed", "failure", "cancelled", "canceled", "not_found"}
          if state not in terminal:
              call(base + "/cancel", "POST")
              for attempt in range(12):
                  state = call(base).get("status")
                  print("After cancellation:", state)
                  if state in terminal:
                      break
                  time.sleep(5)
              else:
                  raise SystemExit("Previous deployment remains stuck after cancellation; new deployment was not started.")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
